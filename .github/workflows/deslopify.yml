name: Deslopify quality

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "deslopify/**"
      - ".github/workflows/deslopify.yml"

permissions:
  contents: read

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate runtime structure
        run: python deslopify/scripts/validate.py deslopify
      - name: Run deterministic tooling tests
        run: python -m unittest discover -s deslopify/tests -v
      - name: Build and verify reviewer package
        run: |
          python deslopify/scripts/bundle.py --kind reviewer --output "$RUNNER_TEMP/reviewer.zip"
          python deslopify/scripts/bundle.py --verify "$RUNNER_TEMP/reviewer.zip"
          unzip -l "$RUNNER_TEMP/reviewer.zip" | grep -q 'BUILD_MANIFEST.json'
          ! unzip -l "$RUNNER_TEMP/reviewer.zip" | grep -q scoring-sheet
